name: validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mur
        run: |
          curl -fsSL https://mur.run/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Validate registry + index is authoritative
        run: mur skill registry-index . --check
  regenerate:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install mur
        run: |
          curl -fsSL https://mur.run/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Regenerate index.yaml only if actually stale
        run: |
          # `--check` compares the `skills` map and ignores `updated_at`, so it is
          # the only honest staleness test. Regenerating unconditionally rewrites
          # the timestamp on every push and commits a no-op — and that bot commit
          # cannot be validated, because a GITHUB_TOKEN push does not trigger
          # workflows.
          if mur skill registry-index . --check; then
            echo "index.yaml is already authoritative — nothing to do"
            exit 0
          fi
          echo "index.yaml is stale — regenerating"
          mur skill registry-index .
          git config user.name "mur-registry-bot"
          git config user.email "bot@mur.run"
          git add index.yaml
          git commit -m "chore: regenerate index.yaml"
          git push
